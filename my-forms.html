<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Forms — LU GPS Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #252820;
      --bg-deep: #1b1e17;
      --card: #7a8c52;
      --card-dark: #697849;
      --text: #f2f0e6;
      --text-muted: rgba(242,240,230,0.6);
      --accent: #9ab54a;
      --red: #e05a4a;
      --radius: 14px;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg-deep);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
    }

    body {
      background-color: var(--bg-deep);
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(27, 30, 23, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(154,181,74,0.15);
      padding: 0 20px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .header-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-dark);
      border: 2px solid rgba(154,181,74,0.35);
      flex-shrink: 0;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .header-logo-fallback {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-new-form {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #1b1e17;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 100px;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-new-form:hover {
      background: #b0cf57;
      transform: translateY(-1px);
    }

    .btn-new-form:active {
      transform: translateY(0);
    }

    /* ── Main content ── */
    .main {
      max-width: 700px;
      margin: 0 auto;
      padding: 32px 16px 80px;
    }

    /* ── Section labels ── */
    .section-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .section + .section {
      margin-top: 40px;
    }

    /* ── Draft cards ── */
    .draft-card {
      background: rgba(122,140,82,0.18);
      border: 1px solid rgba(122,140,82,0.3);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }

    .draft-card:hover {
      border-color: rgba(154,181,74,0.5);
    }

    .draft-card-body {
      flex: 1;
      min-width: 0;
    }

    .draft-project-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .draft-project-number {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .draft-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
    }

    .draft-card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-resume {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent);
      color: #1b1e17;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 100px;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-resume:hover { background: #b0cf57; }

    .btn-dismiss {
      background: none;
      border: 1px solid rgba(242,240,230,0.2);
      color: var(--text-muted);
      font-size: 15px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .btn-dismiss:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* ── Search ── */
    .search-wrap {
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(242,240,230,0.07);
      border: 1.5px solid rgba(242,240,230,0.15);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 13px 44px 13px 16px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-input:focus {
      border-color: var(--accent);
      background: rgba(242,240,230,0.1);
    }

    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    .search-status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      min-height: 20px;
    }

    .search-status.error { color: var(--red); font-style: normal; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(242,240,230,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    /* ── Result cards ── */
    #search-results { margin-top: 14px; }

    .result-card {
      background: rgba(27,30,23,0.7);
      border: 1px solid rgba(242,240,230,0.1);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }

    .result-card:hover { border-color: rgba(154,181,74,0.35); }

    .result-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .result-card-info { flex: 1; min-width: 0; }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 100px;
      margin-bottom: 6px;
    }

    .badge-draft {
      background: rgba(154,181,74,0.2);
      color: var(--accent);
      border: 1px solid rgba(154,181,74,0.4);
    }

    .badge-submitted {
      background: rgba(242,240,230,0.08);
      color: var(--text-muted);
      border: 1px solid rgba(242,240,230,0.15);
    }

    .result-project-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-project-number {
      font-size: 12px;
      color: var(--text-muted);
    }

    .result-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      margin-bottom: 12px;
    }

    .result-actions { display: flex; gap: 8px; }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 100px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-action:active { transform: translateY(1px); }

    .btn-action-primary {
      background: var(--accent);
      color: #1b1e17;
    }

    .btn-action-primary:hover { background: #b0cf57; }

    .btn-action-secondary {
      background: rgba(242,240,230,0.1);
      color: var(--text);
    }

    .btn-action-secondary:hover { background: rgba(242,240,230,0.16); }

    /* ── Empty state ── */
    .empty-state {
      font-size: 14px;
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      padding: 24px 0 8px;
    }

    /* ── Bottom CTA ── */
    .cta-section {
      margin-top: 48px;
    }

    .btn-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--accent);
      color: #1b1e17;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      border-radius: var(--radius);
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-cta:hover {
      background: #b0cf57;
      transform: translateY(-2px);
    }

    .btn-cta:active { transform: translateY(0); }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #2a2e22;
      border: 1px solid rgba(154,181,74,0.2);
      border-radius: var(--radius);
      max-width: 820px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      animation: modalIn 0.2s ease;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 24px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    .modal-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: 16px;
    }

    .modal-close {
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      line-height: 1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .modal-close:hover {
      background: rgba(224,90,74,0.15);
      color: var(--red);
    }

    .print-btn {
      background: rgba(154,181,74,0.15);
      border: 1px solid rgba(154,181,74,0.3);
      color: var(--accent);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .print-btn:hover { background: rgba(154,181,74,0.25); }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .modal-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .modal-body {
      overflow-y: auto;
      padding: 20px 24px 24px;
      flex: 1;
    }

    .modal-body::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    /* ── Detail blocks ── */
    .detail-block { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .detail-block-title { background: rgba(0,0,0,0.2); padding: 9px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(154,181,74,0.7); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .detail-block-body { padding: 12px 16px; font-size: 14px; line-height: 1.9; }
    .dv-row { display: flex; gap: 10px; margin-bottom: 2px; }
    .dv-key { color: var(--text-muted); min-width: 160px; flex-shrink: 0; font-size: 13px; }
    .dv-val { font-weight: 500; color: var(--text); font-size: 14px; }
    .dv-layer { margin-bottom: 8px; }
    .dv-layer-name { font-weight: 600; color: var(--text); }
    .dv-row-entry { margin-top: 1px; padding-left: 10px; border-left: 2px solid rgba(154,181,74,0.2); font-size: 13px; color: var(--text-muted); }
    .attach-list { display: flex; flex-direction: column; gap: 8px; }
    .attach-item { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 14px; text-decoration: none; color: var(--text); transition: all 0.2s; }
    .attach-item:hover { background: rgba(154,181,74,0.1); border-color: rgba(154,181,74,0.3); color: var(--accent); }
    .attach-item-name { font-size: 14px; font-weight: 500; flex: 1; }
    .attach-item-open { font-size: 11px; color: rgba(242,240,230,0.35); }

    /* ── Print ── */
    @media print {
      html, body { width: 100%; height: auto; margin: 0; padding: 0; }
      body > *:not(#print-area) { display: none !important; }
      #print-area { display: block !important; position: relative; width: 100%; height: auto; min-height: 100%; margin: 0; padding: 32px; box-sizing: border-box; background: white; font-family: 'Outfit', Arial, sans-serif; color: #1a1a1a; font-size: 13px; page-break-after: avoid; }
      #print-area * { display: inherit; visibility: visible !important; }
      .print-header { display: flex !important; margin-bottom: 24px; padding-bottom: 14px; border-bottom: 2px solid #5a7a30; }
      .print-header-title { font-size: 20px; font-weight: 700; color: #3a5c1a; }
      .print-header-sub { font-size: 12px; color: #666; margin-top: 2px; }
      .print-section { display: block !important; margin-bottom: 16px; border: 1px solid #ccd8a8; border-radius: 6px; overflow: visible; page-break-inside: avoid; }
      .print-section-title { display: block !important; background: #eef4e0; padding: 6px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #4a6820; border-bottom: 1px solid #ccd8a8; }
      .print-section-body { display: block !important; padding: 10px 12px; }
      .print-row { display: flex !important; gap: 8px; margin-bottom: 4px; line-height: 1.5; }
      .print-key { min-width: 160px; flex-shrink: 0; color: #555; font-size: 12px; }
      .print-val { font-weight: 600; font-size: 13px; color: #1a1a1a; }
      .print-layer { display: block !important; margin-bottom: 6px; }
      .print-layer-name { font-weight: 700; color: #2a4a10; }
      .print-layer-entry { display: block !important; padding-left: 10px; border-left: 2px solid #8ab840; color: #444; font-size: 12px; margin-top: 1px; }
      .print-footer { display: flex !important; justify-content: space-between; margin-top: 24px; padding-top: 10px; border-top: 1px solid #ccc; font-size: 11px; color: #888; }
    }
  </style>
</head>
<body>
<div id="print-area" style="display:none"></div>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="header-logo">
      <img src="" alt="LU" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
      <span class="header-logo-fallback" style="display:none;">LU</span>
    </div>
    <span class="header-title">LU GPS Dashboard Form</span>
  </div>
  <a href="gps_dashboard_form_steps.html" class="btn-new-form">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    New Form
  </a>
</header>

<!-- Main -->
<main class="main">

  <!-- Local Drafts Section -->
  <section class="section" id="drafts-section" style="display:none;">
    <div class="section-eyebrow">On This Device</div>
    <div id="drafts-list"></div>
  </section>

  <!-- Search Section -->
  <section class="section" id="search-section">
    <div class="section-eyebrow">Find a Form</div>
    <div class="search-wrap">
      <input
        type="search"
        class="search-input"
        id="search-input"
        placeholder="Search by name, project name, or number…"
        autocomplete="off"
        spellcheck="false"
      />
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
    </div>
    <div class="search-status" id="search-status"></div>
    <div id="search-results"></div>
  </section>

  <!-- Bottom CTA -->
  <section class="cta-section">
    <a href="gps_dashboard_form_steps.html" class="btn-cta">
      Start a New Form
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </section>

</main>

<!-- View Details Modal -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div class="modal-title" id="modal-title">Submission Details</div>
        <div class="modal-sub" id="modal-sub"></div>
      </div>
      <div class="modal-header-actions">
        <button class="print-btn" id="print-btn" onclick="printSubmission()" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print / Save PDF
        </button>
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      </div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwXspvQ63z8DmLarsvWt7xXQf1iYkAVpTy2Qccvmhnh8ViXJmyoDcMVJkPN9G-I9P7q/exec';
  const DRAFT_KEY = 'm4_dashboard_drafts';
  const SCOPE_LABELS = { irrigation:'Irrigation', drainage:'Drainage', golf:'Golf Course Features', other:'Other' };
  let currentDetailSub = null;

  // ── Utilities ──────────────────────────────────────────────────────────────

  function formatDate(raw) {
    if (!raw) return '—';
    const d = new Date(raw);
    if (isNaN(d)) return raw;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escape(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Local Drafts ──────────────────────────────────────────────────────────

  function loadLocalDrafts() {
    let drafts = [];
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (raw) drafts = JSON.parse(raw);
      if (!Array.isArray(drafts)) drafts = [];
    } catch (e) {
      drafts = [];
    }

    const section = document.getElementById('drafts-section');
    const list = document.getElementById('drafts-list');

    if (!drafts.length) {
      section.style.display = 'none';
      return;
    }

    section.style.display = '';
    list.innerHTML = drafts.map(d => buildLocalDraftCard(d)).join('');

    list.querySelectorAll('.btn-dismiss-local').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        removeDraft(id);
        loadLocalDrafts();
      });
    });
  }

  function buildLocalDraftCard(d) {
    const stepLabel = d.currentStep && d.totalSteps
      ? `Step ${d.currentStep} of ${d.totalSteps}`
      : (d.currentStep ? `Step ${d.currentStep}` : 'In Progress');
    const saved = formatDate(d.lastSaved || d.savedAt);
    const projectName = escape(d.projectName || d.project_name || 'Untitled Project');
    const projectNumber = escape(d.projectNumber || d.project_number || '');
    const submitter = escape(d.submitterName || d.submitter_name || d.name || '');
    const id = escape(d.id || d.draftId || '');

    return `
      <div class="draft-card">
        <div class="draft-card-body">
          <div class="draft-project-name">${projectName}</div>
          ${projectNumber ? `<div class="draft-project-number">${projectNumber}</div>` : ''}
          <div class="draft-meta">
            ${submitter ? `<span>${submitter}</span>` : ''}
            <span>${stepLabel}</span>
            ${saved ? `<span>Saved ${saved}</span>` : ''}
          </div>
        </div>
        <div class="draft-card-actions">
          <a href="gps_dashboard_form_steps.html?draft=${id}" class="btn-resume">Resume →</a>
          <button class="btn-dismiss btn-dismiss-local" data-id="${id}" aria-label="Remove draft" title="Remove">×</button>
        </div>
      </div>`;
  }

  function removeDraft(id) {
    try {
      let drafts = JSON.parse(localStorage.getItem(DRAFT_KEY) || '[]');
      if (!Array.isArray(drafts)) drafts = [];
      drafts = drafts.filter(d => String(d.id || d.draftId || '') !== String(id));
      localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts));
    } catch (e) {}
  }

  // ── Search ────────────────────────────────────────────────────────────────

  let searchTimer = null;
  let lastQuery = '';

  document.getElementById('search-input').addEventListener('input', function () {
    const q = this.value.trim();
    clearTimeout(searchTimer);

    if (q === lastQuery) return;

    if (q.length < 2) {
      lastQuery = '';
      setStatus('');
      setResults('');
      return;
    }

    searchTimer = setTimeout(() => doSearch(q), 400);
  });

  async function doSearch(q) {
    if (q === lastQuery) return;
    lastQuery = q;

    setStatus('<span class="spinner"></span>Searching…');
    setResults('');

    try {
      const url = `${APPS_SCRIPT_URL}?action=search&q=${encodeURIComponent(q)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      // Guard against stale response
      if (document.getElementById('search-input').value.trim() !== q) return;

      setStatus('');
      renderResults(data, q);
    } catch (err) {
      if (document.getElementById('search-input').value.trim() !== q) return;
      setStatus('Search unavailable — check your connection', true);
      setResults('');
    }
  }

  function setStatus(html, isError = false) {
    const el = document.getElementById('search-status');
    el.innerHTML = html;
    el.className = 'search-status' + (isError ? ' error' : '');
  }

  function setResults(html) {
    document.getElementById('search-results').innerHTML = html;
  }

  function buildResultCard(item, idx) {
    const isDraft = (item.type || '').toLowerCase() === 'draft';
    const badgeClass = isDraft ? 'badge-draft' : 'badge-submitted';
    const badgeLabel = isDraft ? 'DRAFT' : 'SUBMITTED';

    const projectName = escape(item.projectName || item.project_name || 'Untitled Project');
    const projectNumber = escape(item.projectNumber || item.project_number || '');
    const submitter = escape(item.submitterName || item.submitter_name || item.name || '');
    const dateRaw = item.submittedAt || item.submitted_at || item.lastSaved || item.savedAt;
    const dateLabel = isDraft
      ? `Step ${item.currentStep || '?'} of 5 · Last saved ${formatDate(dateRaw)}`
      : `Submitted ${formatDate(dateRaw)}`;
    const id = escape(item.id || item.draftId || '');

    const actionBtn = isDraft
      ? `<a href="gps_dashboard_form_steps.html?draft=${id}" class="btn-action btn-action-primary">Resume Draft →</a>`
      : `<button class="btn-action btn-action-secondary btn-view-details" data-idx="${idx}">View Details →</button>`;

    return `
      <div class="result-card">
        <div class="result-card-top">
          <div class="result-card-info">
            <div><span class="badge ${badgeClass}">${badgeLabel}</span></div>
            <div class="result-project-name">${projectName}</div>
            ${projectNumber ? `<div class="result-project-number">${projectNumber}</div>` : ''}
          </div>
        </div>
        <div class="result-meta">
          ${submitter ? `<span>${submitter}</span>` : ''}
          <span>${dateLabel}</span>
        </div>
        <div class="result-actions">${actionBtn}</div>
      </div>`;
  }

  function renderResults(data, q) {
    let items = [];
    if (Array.isArray(data)) items = data;
    else if (Array.isArray(data.results)) items = data.results;
    else if (Array.isArray(data.data)) items = data.data;

    if (!items.length) {
      setResults(`<div class="empty-state">No results found for "<em>${escape(q)}</em>"</div>`);
      return;
    }

    const html = items.map((item, idx) => buildResultCard(item, idx)).join('');
    setResults(html);

    document.querySelectorAll('.btn-view-details').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx, 10);
        openModal(items[idx]);
      });
    });
  }

  // ── Modal ─────────────────────────────────────────────────────────────────

  async function openModal(item) {
    currentDetailSub = null;
    document.getElementById('modal-title').textContent = item.projectName || 'Loading…';
    document.getElementById('modal-sub').textContent = '';
    document.getElementById('modal-body').innerHTML = '<div style="text-align:center;padding:48px;color:var(--text-muted)">Loading details…</div>';
    document.getElementById('print-btn').style.display = 'none';
    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('modal-close').focus();

    try {
      const res = await fetch(APPS_SCRIPT_URL);
      const allSubs = await res.json();
      const match = Array.isArray(allSubs) ? allSubs.find(s => s.id === item.id) : null;
      if (!match) throw new Error('Submission not found');

      const s = {
        id: match.id,
        submittedAt: match.submittedAt || '',
        submitter: match.submitter || '',
        project: {
          name: match.projectName || '',
          number: match.projectNumber || '',
          date: match.projectDate || '',
          collector: match.gpsCollector || '',
          notes: match.projectNotes || ''
        },
        scope: match.scope || [],
        layers: { irrigation: match.irrigationLayers || [], drainage: match.drainageLayers || [], golf: match.golfLayers || [] },
        hbhDrainage: match.hbhDrainage || [],
        hbhIrrigation: match.hbhIrrigation || [],
        hbhSpecial: match.hbhSpecial || [],
        specialFeatures: match.specialFeatures || [],
        useEstimates: match.useEstimates || false,
        estimates: match.estimates || [],
        attachments: match.attachments || []
      };

      currentDetailSub = s;
      document.getElementById('modal-title').textContent = s.project.name || 'Untitled Project';
      document.getElementById('modal-sub').textContent = 'Submitted ' + s.submittedAt + ' by ' + s.submitter;
      document.getElementById('modal-body').innerHTML = buildDetailHTML(s);
      document.getElementById('print-btn').style.display = 'flex';
    } catch(err) {
      document.getElementById('modal-body').innerHTML = '<div style="color:var(--red);padding:20px">Could not load details: ' + escape(err.message) + '</div>';
    }
  }

  function buildDetailHTML(s) {
    const scopeLabel = (s.scope||[]).map(sc => SCOPE_LABELS[sc]||sc).join(', ');
    let html = block('Project Info',
      dvr('Project Name', s.project.name) + dvr('Project Number', s.project.number) +
      dvr('Start Date', s.project.date||'—') + dvr('Submitted by', s.submitter) +
      dvr('GPS Collector', s.project.collector||'—') + (s.project.notes ? dvr('Notes', s.project.notes) : ''));
    html += block('Scope', dvr('Selected Scope', scopeLabel||'—'));
    const lgroups = [
      {data:s.layers.irrigation, label:'Irrigation Tracking'},
      {data:s.layers.drainage,   label:'Drainage Tracking'},
      {data:s.layers.golf,       label:'Golf Course Tracking'},
      {data:s.hbhDrainage,       label:'Hole-by-Hole Drainage'},
      {data:s.hbhIrrigation,     label:'Hole-by-Hole Irrigation'},
      {data:s.hbhSpecial,        label:'Hole-by-Hole Special Features'}
    ].filter(g => g.data && g.data.length > 0);
    const hasSF = s.specialFeatures && s.specialFeatures.length > 0;
    if (lgroups.length > 0 || hasSF) {
      let lb = '';
      lgroups.forEach(g => { lb += dvr(g.label, g.data.join(', ')); });
      if (hasSF) lb += dvr('Special Features', s.specialFeatures.map(f => f.name + (f.type ? ' ('+f.type+')' : '')).join(', '));
      html += block('Tracking Layers', lb);
    }
    let eb = dvr('Compare to estimates?', s.useEstimates ? 'Yes' : 'No');
    if (s.useEstimates && s.estimates && s.estimates.length) {
      s.estimates.forEach(est => {
        eb += '<div class="dv-layer" style="margin-top:10px"><div class="dv-layer-name">&#10003; ' + escape(est.name) + '</div>';
        (est.rows||[]).forEach(row => {
          const p = [];
          if (row.specs) p.push(row.specs);
          if (row.qty) p.push('Qty: ' + row.qty);
          if (p.length) eb += '<div class="dv-row-entry">' + escape(p.join(' — ')) + '</div>';
        });
        eb += '</div>';
      });
    }
    html += block('Estimate Quantities', eb);
    const attachments = s.attachments || [];
    let ab = '';
    if (attachments.length > 0) {
      ab += '<div class="attach-list">';
      attachments.forEach(a => {
        ab += '<a class="attach-item" href="' + a.url + '" target="_blank" rel="noopener">'
          + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>'
          + '<span class="attach-item-name">' + escape(a.name) + '</span>'
          + '<span class="attach-item-open">Open / Download ↗</span></a>';
      });
      ab += '</div>';
    } else {
      ab = '<div style="font-size:13px;color:var(--text-muted)">No attachments</div>';
    }
    html += block('Attachments', ab);
    return html;
  }

  function block(t, b) {
    return '<div class="detail-block"><div class="detail-block-title">' + t + '</div><div class="detail-block-body">' + b + '</div></div>';
  }

  function dvr(k, v) {
    return '<div class="dv-row"><span class="dv-key">' + k + '</span><span class="dv-val">' + escape(String(v||'')) + '</span></div>';
  }

  function printSubmission() {
    if (!currentDetailSub) return;
    const s = currentDetailSub;
    const scopeLabel = (s.scope||[]).map(sc => SCOPE_LABELS[sc]||sc).join(', ');
    const lgroups = [
      {data:s.layers.irrigation, label:'Irrigation Tracking'},
      {data:s.layers.drainage,   label:'Drainage Tracking'},
      {data:s.layers.golf,       label:'Golf Course Tracking'},
      {data:s.hbhDrainage,       label:'Hole-by-Hole Drainage'},
      {data:s.hbhIrrigation,     label:'Hole-by-Hole Irrigation'},
      {data:s.hbhSpecial,        label:'Hole-by-Hole Special Features'}
    ].filter(g => g.data && g.data.length > 0);
    const hasSF = s.specialFeatures && s.specialFeatures.length > 0;
    const prow = (k,v) => '<div class="print-row"><span class="print-key">'+k+'</span><span class="print-val">'+v+'</span></div>';
    const psec = (t,b) => '<div class="print-section"><div class="print-section-title">'+t+'</div><div class="print-section-body">'+b+'</div></div>';
    let html = '<div class="print-header"><div class="print-header-title">LU GPS Dashboard Form</div>'
      + '<div class="print-header-sub">Submitted ' + s.submittedAt + ' by ' + s.submitter + '</div></div>';
    html += psec('Project Info',
      prow('Project Name', s.project.name) + prow('Project Number', s.project.number) +
      prow('Start Date', s.project.date||'—') + prow('Submitted by', s.submitter) +
      prow('GPS Collector', s.project.collector||'—') + prow('Scope', scopeLabel) +
      (s.project.notes ? prow('Notes', s.project.notes) : ''));
    if (lgroups.length > 0 || hasSF) {
      let lb = '';
      lgroups.forEach(g => { lb += prow(g.label, g.data.join(', ')); });
      if (hasSF) lb += prow('Special Features', s.specialFeatures.map(f => f.name+(f.type?' ('+f.type+')':'')).join(', '));
      html += psec('Tracking Layers', lb);
    }
    let eb = prow('Compare to estimates?', s.useEstimates ? 'Yes' : 'No');
    if (s.useEstimates && s.estimates && s.estimates.length) {
      s.estimates.forEach(est => {
        eb += '<div class="print-layer"><div class="print-layer-name">&#10003; '+est.name+'</div>';
        (est.rows||[]).forEach(row => {
          const p = []; if(row.specs)p.push(row.specs); if(row.qty)p.push('Qty: '+row.qty);
          if(p.length) eb += '<div class="print-layer-entry">'+p.join(' — ')+'</div>';
        });
        eb += '</div>';
      });
    }
    html += psec('Estimate Quantities', eb);
    if (s.attachments && s.attachments.length) {
      let ab = '';
      s.attachments.forEach(a => { ab += '<div class="print-attach-item">📎 '+a.name+' — '+a.url+'</div>'; });
      html += psec('Attachments', ab);
    }
    html += '<div class="print-footer"><span>Submission ID: '+s.id+'</span><span>m4fieldview.github.io/M4-Dashboard-Form</span></div>';
    const area = document.getElementById('print-area');
    area.style.display = 'block';
    area.innerHTML = html;
    window.print();
    area.style.display = 'none';
    area.innerHTML = '';
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    currentDetailSub = null;
    document.getElementById('print-btn').style.display = 'none';
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);

  document.getElementById('modal-overlay').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  // ── Init ──────────────────────────────────────────────────────────────────

  loadLocalDrafts();
</script>

</body>
</html>
